apiVersion: apps/v1
kind: ReplicaSet
metadata: 
  name: my-replica-set
  namespace: default
  labels:
    app: my-app-deep
    type: my-type-deep
spec:
  replicas: 5
  selector:
    matchLabels:
      app: my-app-deep

      # same as pod yml
  template:
    metadata:
      labels:
        app: my-app-deep
    spec:
      containers:
      - name: my-container
        image: nginx:latest
        ports:
        - containerPort: 80