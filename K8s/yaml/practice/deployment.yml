apiVersion: apps/v1
kind: Deployment
metadata: 
  name: my-deployment-deep
  namespace: default
labels:
    app: my-app-deep
    type: my-type-deep
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: my-app-deep

      # same as pod yml
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1


  template:
    metadata:
      labels:
        app: my-app-deep
    spec:
      containers:
      - name: my-container
        image: nginx:1.19
        ports:
        - containerPort: 80